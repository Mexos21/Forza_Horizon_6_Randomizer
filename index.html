<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FH6 Advanced Challenge Generator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- SweetAlert2 CSS y JS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="src/main.js"></script>
</head>

<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
      <h2>🎰 FH6 Advanced Challenge Generator</h2>
      <div>
        <button id="instructionsBtn"
          style="background: #4a5568; border: none; border-radius: 40px; margin-bottom: 10px; padding: 6px 16px; margin-right: 10px; color: white; font-weight: bold; cursor: pointer; width: auto;">❓
          Instructions</button>
        <button id="themeToggleBtn"
          style="background: #e53e3e; border: none; border-radius: 40px; padding: 6px 16px; color: white; font-weight: bold; cursor: pointer; width: auto;">🌙
          JDM Mode</button>
      </div>
    </div>

    <div class="dataset-status">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div class="points-bar" style="display: flex; align-items: center; gap: 12px;">
          <span>🏆 <strong>Honor Points:</strong> <span id="pointsDisplay">0</span></span>
        </div>
        <div class="strict-mode-toggle" style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 13px;">🔒 Strict Mode</span>
          <label class="switch">
            <input type="checkbox" id="strictModeToggle">
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <strong>📊 Dataset Status:</strong> <span id="datasetStatus">Loading cars...</span>
    </div>

    <div class="filters-panel">
      <h4>⚙️ Target Filter Pool (Select Multiple options)</h4>
      <div class="filters-grid">
        <!-- Manufacturers -->
        <div class="filter-group">
          <label>Manufacturers:</label>
          <div id="manufacturersList" class="checkbox-scroll"></div>
        </div>

        <!-- Car Models -->
        <div class="filter-group">
          <label>Car Models:</label>
          <div id="modelsList" class="checkbox-scroll"></div>
        </div>

        <!-- Countries -->
        <div class="filter-group">
          <label>Countries:</label>
          <div id="countriesList" class="checkbox-scroll"></div>
        </div>

        <!-- Decades -->
        <div class="filter-group">
          <label>Decades / Eras:</label>
          <div id="decadesList" class="checkbox-scroll"></div>
        </div>

        <!-- Car Types / Styles (ocupa ambas columnas) -->
        <div class="filter-group full-width">
          <label>Car Types / Styles:</label>
          <div id="typesList" class="checkbox-scroll inline-scroll"></div>
        </div>

        <!-- Performance Classes -->
        <div class="filter-group full-width">
          <label>Performance Classes:</label>
          <div id="classesList" class="inline-scroll"></div>
        </div>
      </div>
    </div>

    <button id="spinButton">🎯 Spin Roulette</button>

    <button id="clearFiltersButton" style="background: #4a5568; margin-top: 10px;">🗑️ Clear Filter</button>

    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button id="exportCodeBtn" style="background: #4a5568; width: 20%;">📋 Export</button>
      <input type="text" id="importCodeInput" placeholder="Paste code here"
        style="width: 60%; padding: 8px; border-radius: 40px; border: 1px solid var(--border-color); background: var(--checkbox-bg); color: var(--text-primary);">
      <button id="importCodeBtn" style="background: #4a5568; width: 20%;">📥 Import</button>
    </div>
  </div>
</body>

</html>
